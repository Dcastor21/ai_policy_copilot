version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount the app directory for development (hot reload)
      - ./app:/app/app
      # Mount uploads directory to persist uploaded files
      - ./uploads:/app/uploads
      # Mount FAISS index directory to persist vector store
      - ./faiss_index:/app/faiss_index
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s